name: TV-EAM web checks
on:
  pull_request:
  push:
    branches: [codex/tv-eam-phase3]
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned direct dependencies
        run: npm install
      - name: Inspect generated lock and dependency advisories
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import {spawnSync} from "node:child_process";
          console.log("TV_EAM_LOCK_BEGIN");
          console.log(fs.readFileSync("package-lock.json","utf8"));
          console.log("TV_EAM_LOCK_END");
          const audit=spawnSync("npm",["audit","--json"],{encoding:"utf8"});
          console.log("TV_EAM_AUDIT_BEGIN");
          console.log(audit.stdout);
          console.log("TV_EAM_AUDIT_END");
          if(audit.error) throw audit.error;
          NODE
      - name: Strict TypeScript
        run: npm run typecheck
      - name: Test data mapping, time semantics and QR decode
        run: npm test
      - name: Production build
        run: npm run build
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Public shell and mobile login smoke tests
        run: npm run test:browser
